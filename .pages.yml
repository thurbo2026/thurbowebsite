# Instellingen voor het beheerscherm (Pages CMS, pagescms.org). Snel naar het beheerscherm: thurbo.nl/admin
# De onderdelen staan in dezelfde volgorde als het menu op de site.
# Velden met "EN" zijn de Engelse versie. Laat je die leeg, dan vult Claude ze elke zondagavond met een vertaling.
# Een Engelse tekst die je zelf invult, blijft staan.
# Links in teksten: [woord](https://adres). Losse https-adressen en e-mailadressen worden vanzelf klikbaar.
media:
  input: img
  output: /img
content:
- name: projecten
  label: 1. Projecten
  type: file
  path: content/projecten.json
  format: json
  fields:
  - name: projecten
    label: "Projecten (sleep om de volgorde te bepalen; de eerste 10 staan ook in de slideshow op de homepage)"
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{titel}"
    fields:
    - name: titel
      label: Titel
      type: string
      required: true
    - name: titel_en
      label: "Titel EN (leeg laten: wordt vanzelf vertaald)"
      type: string
    - name: plaats
      label: Plaats (achter de titel)
      type: string
    - name: plaats_en
      label: "Plaats EN (leeg laten: wordt vanzelf vertaald)"
      type: string
    - name: ontworpen_door
      label: "Ontworpen door (bepaalt de letter t, b of tb)"
      type: select
      options:
        multiple: true
        values:
        - Thorben
        - Beau
    - name: datum
      label: "Datum (jjjj-mm, bijv. 2024-06); bepaalt het projectnummer: het oudste project is 01; zonder datum komt het achteraan"
      type: string
    - name: fotos
      label: Foto's (de eerste is ook de miniatuur en het beeld in de slideshow)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{bijschrift}"
      fields:
      - name: beeld
        label: Foto
        type: image
      - name: uitsnede
        label: "Uitsnede (bijsnijden op de site; het origineel blijft heel)"
        type: select
        options: &id001
          values:
          - Origineel
          - Vierkant
          - "Liggend 4:3"
          - "Liggend 3:2"
          - "Breed 16:9"
          - "Panorama 2:1"
          - "Panorama 3:1"
          - "Staand 4:5"
          - "Staand 2:3"
      - name: focus
        label: Focus (welk deel blijft zichtbaar bij bijsnijden)
        type: select
        options: &id002
          values:
          - Midden
          - Boven
          - Onder
          - Links
          - Rechts
          - Linksboven
          - Rechtsboven
          - Linksonder
          - Rechtsonder
      - name: bijschrift
        label: Bijschrift
        type: string
      - name: bijschrift_en
        label: "Bijschrift EN (leeg laten: wordt vanzelf vertaald)"
        type: string
    - name: tekeningen
      label: Tekeningen
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{bijschrift}"
      fields:
      - name: beeld
        label: Tekening
        type: image
      - name: uitsnede
        label: "Uitsnede (bijsnijden op de site; het origineel blijft heel)"
        type: select
        options: *id001
      - name: focus
        label: Focus (welk deel blijft zichtbaar bij bijsnijden)
        type: select
        options: *id002
      - name: bijschrift
        label: Bijschrift
        type: string
      - name: bijschrift_en
        label: "Bijschrift EN (leeg laten: wordt vanzelf vertaald)"
        type: string
    - name: tekst
      label: "Projecttekst (link: [woord](https://adres))"
      type: text
    - name: tekst_en
      label: "Projecttekst EN (leeg laten: wordt vanzelf vertaald) (link: [word](https://address))"
      type: text
    - name: jaar
      label: Jaar
      type: string
    - name: locatie
      label: Locatie
      type: string
    - name: locatie_en
      label: "Locatie EN (leeg laten: wordt vanzelf vertaald)"
      type: string
    - name: opgave
      label: Opgave
      type: string
    - name: opgave_en
      label: "Opgave EN (leeg laten: wordt vanzelf vertaald)"
      type: string
    - name: type
      label: Type
      type: string
    - name: type_en
      label: "Type EN (leeg laten: wordt vanzelf vertaald)"
      type: string
    - name: status
      label: Status
      type: string
    - name: status_en
      label: "Status EN (leeg laten: wordt vanzelf vertaald)"
      type: string
    - name: bureau_of_begeleiding
      label: Bureau of begeleiding
      type: string
    - name: bureau_link
      label: "Website bureau (https://...)"
      type: string
    - name: ontwerpteam
      label: Ontwerpteam (alle namen)
      type: string
    - name: categorie
      label: Categorie (voor het filter)
      type: select
      options:
        values:
        - Studie
        - Praktijk
        - Eigen werk
        - Prijsvraag
    - name: lat
      label: "Kaart: breedtegraad (bijv. 51.4486)"
      type: string
    - name: lng
      label: "Kaart: lengtegraad (bijv. 5.4565)"
      type: string
