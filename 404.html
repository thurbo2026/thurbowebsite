<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THURBO · 404</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>@font-face{font-family:"THURBO Helvetica";src:local("Helvetica Neue"),local("Helvetica"),url(/fonts/heros-regular.woff) format("woff")}</style>
<style>
:root{color-scheme:light;--bg:#fbfbf9;--fg:#242424;--muted:#6d6d68;--line:#242424;
  --sans:"THURBO Helvetica","Helvetica Neue",Helvetica,Arial,sans-serif;--type:var(--sans);
  --s1:clamp(15px,1.1vw + 11px,19px);--s2:clamp(17px,1.4vw + 12px,24px)}
@media (prefers-color-scheme:dark){:root{--bg:#242424;--fg:#ececea;--muted:#9a9a94;--line:#ececea;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--s1);line-height:1.4;margin:0}
a{color:inherit}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--line);padding-block:18px;font-size:var(--s2)}
header a{font-weight:500;letter-spacing:.02em;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:7px}
main{max-width:1280px;margin:0 auto;padding-block:32px 48px;display:grid;gap:16px;align-content:start}
img{width:100%;height:auto;display:block;max-height:calc(100svh - 300px);object-fit:contain;object-position:left top}
@media (min-width:800px){main{grid-template-columns:minmax(0,2.2fr) minmax(220px,1fr);grid-template-rows:1fr auto auto auto;column-gap:48px;align-items:end;min-height:calc(100svh - 80px);align-content:center}
  img{grid-row:1 / 5;max-height:calc(100svh - 160px);object-position:center}
  main > :not(img){grid-column:2}main > h1{grid-row:2}main > p{grid-row:3}main > a{grid-row:4;justify-self:start}}
h1{font-weight:400;font-size:var(--s2);margin:0;text-wrap:balance}
p{margin:0;font-family:var(--type);font-size:14px;color:var(--muted)}
.terug{font-size:var(--s1);text-underline-offset:5px}
</style>
</head>
<body>
<header class="pad"><a href="/">THURBO</a></header>
<main class="pad">
  <img src="/perceel.svg?v=404" alt="Bouwtekening van een leeg perceel, schaal 1:404, met de stempel niet vergund">
  <h1 id="kop">Hier is (nog) niets vergund.</h1>
  <p id="sub">Perceel 404. Deze pagina bestaat niet, of is nog in ontwerp.</p>
  <a class="terug" id="terug" href="/">Terug naar THURBO</a>
</main>
<script>
var l; try{l=localStorage.getItem('thurbo-lang')}catch(e){}
if(l!=="nl"&&l!=="en") l=(navigator.language||"nl").toLowerCase().indexOf("nl")===0?"nl":"en";
if(l==="en"){document.documentElement.lang="en";
  document.getElementById('kop').textContent="Nothing has been permitted here (yet).";
  document.getElementById('sub').textContent="Plot 404. This page does not exist, or is still being designed.";
  document.getElementById('terug').textContent="Back to THURBO";}
</script>
</body>
</html>
