<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THURBO</title>
<meta name="description" content="THURBO is de ontwerpstudio van Thorben Contant en Beau Schellevis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Courier+Prime&display=swap">
<style>
/* Layout: één kopregel, raster van dunne lijnen, beelden schermbreed. Zwart-wit; het werk draagt de kleur.
   De typemachineletter komt uit Thorbens portfolio en wordt gebruikt voor feiten en bijschriften. */
:root{color-scheme:light;
  --bg:#fbfbf9; --fg:#121212; --muted:#6d6d68; --line:#121212; --stage:#f1f1ed;
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --type:"Courier Prime","Courier New",ui-monospace,monospace;
  --s1:clamp(15px,1.1vw+11px,19px); --s2:clamp(17px,1.4vw+12px,24px); --s3:clamp(32px,4vw+14px,56px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--fg:#ececea;--muted:#9a9a94;--line:#ececea;--stage:#1c1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--fg:#ececea;--muted:#9a9a94;--line:#ececea;--stage:#1c1c1a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--s1);line-height:1.4;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* kopregel */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding-block:18px;font-size:var(--s2)}
.burger{width:32px;height:14px;display:grid;align-content:space-between;flex:none}
.burger i{display:block;height:1.5px;background:var(--fg)}
.burger.x i:first-child{transform:translateY(6.25px) rotate(45deg)}
.burger.x i:last-child{transform:translateY(-6.25px) rotate(-45deg)}
.name{display:flex;gap:.6em;flex-wrap:wrap;align-items:baseline;min-width:0}
.name button{white-space:nowrap;text-decoration-thickness:1.5px;text-underline-offset:7px}
.name .brand{font-weight:500;letter-spacing:.02em}
.name button[aria-pressed="true"]{text-decoration-line:underline}
.name button:hover{text-decoration-line:underline;text-decoration-style:dotted}

/* binnenkomer */
.hero{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;max-height:88vh;overflow:hidden;background:#000;display:block}
@media (min-width:800px){.hero{aspect-ratio:16/9}}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.cap{font-family:var(--type);font-size:13px;color:var(--muted);padding-block:10px}

/* menu */
.menu{display:grid;grid-template-columns:1fr 1fr}
.menu button{aspect-ratio:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:var(--s2);text-transform:uppercase;letter-spacing:.04em;display:grid;place-items:center;text-align:center;padding:12px}
.menu button:nth-child(2n){border-right:0}
.menu button:hover{background:var(--fg);color:var(--bg)}
@media (min-width:900px){.menu{grid-template-columns:repeat(4,1fr)}.menu button:nth-child(2n){border-right:1px solid var(--line)}.menu button:nth-child(4n){border-right:0}.menu button{aspect-ratio:4/3}}

/* filter */
.chips{display:flex;gap:18px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
.chips button{color:var(--muted)}
.chips button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-underline-offset:5px}

/* projectraster */
.grid{display:grid;grid-template-columns:1fr 1fr}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:16px 12px 18px;text-align:center;min-width:0;text-decoration:none}
.cell:nth-child(2n){border-right:0}
@media (min-width:900px){.cell:nth-child(2n){border-right:1px solid var(--line)}.cell:nth-child(4n){border-right:0}}
.num{font-size:var(--s3);line-height:1;font-variant-numeric:tabular-nums}
.by{font-family:var(--type);font-size:13px;vertical-align:super;margin-left:3px;color:var(--muted)}
.thumb{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;overflow:hidden}
.thumb img{max-height:100%;max-width:82%;object-fit:contain}
.ttl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl strong{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.cell:hover .thumb img{opacity:.7}
.empty{grid-column:1/-1;padding:40px 20px;color:var(--muted);text-align:center}

/* projectpagina */
.phead{display:flex;justify-content:space-between;gap:16px;padding-block:18px;font-size:var(--s2);line-height:1.25}
.phead strong{font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.close{font-size:30px;line-height:1;flex:none;text-decoration:none}
.stage{position:relative;height:min(68vh,78vw);min-height:260px;max-width:100%;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.stage img{max-width:100%;max-height:100%;object-fit:contain}
.stage .tap{position:absolute;top:0;bottom:0;left:0;width:50%;cursor:w-resize}
.stage .tap.r{left:50%;cursor:e-resize}
.bij{font-family:var(--type);font-size:13px;color:var(--muted);padding-block:10px 0;min-height:1.4em}
.pbar{display:flex;justify-content:space-between;align-items:center;padding-block:12px 18px;font-variant-numeric:tabular-nums}
.pbar button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:5px}
.info{display:grid;gap:28px;padding-block:8px 64px;max-width:66ch}
.info p{margin:0}
.facts{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 16px;margin:0;font-family:var(--type);font-size:.92em}
.facts dt{color:var(--muted)}
.facts dd{margin:0}

/* studio */
.list{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:26px 16px;padding-block:32px 64px;max-width:860px;margin:0}
.list dt{font-size:.9em;color:var(--muted)}
.list dd{margin:0;max-width:56ch}
.note{font-family:var(--type);font-size:13px;color:var(--muted);padding-block:14px;border-top:1px solid var(--line);margin:0}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease}@keyframes f{from{opacity:.4}}}
</style>
</head>
<body>
<header id="hdr" class="pad">
  <button class="burger" id="burger" aria-label="Menu openen"><i></i><i></i></button>
  <nav class="name" aria-label="Filter op ontwerper"><button class="brand" data-p="Alle" aria-pressed="true">THURBO</button><button data-p="Thorben" aria-pressed="false">Thorben Contant</button><button data-p="Beau" aria-pressed="false">Beau Schellevis</button></nav>
</header>
<main id="app"></main>
<script>
/* ===== INHOUD =====
   Later komt dit uit één bestand (content/projecten.json) dat jullie via het beheerscherm aanpassen.
   Per project: de eerste foto is ook de miniatuur in het overzicht. */
let SITE;
/* De inhoud staat in content/site.json en wordt beheerd via Pages CMS. */
fetch('/content/site.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  SITE={hoofdbeeld:{src:d.hoofdbeeld.beeld,bijschrift:d.hoofdbeeld.bijschrift},
    projecten:d.projecten.map(p=>({nr:p.nummer,titel:p.titel,plaats:p.plaats,cat:p.categorie,door:p.ontworpen_door||[],jaar:p.jaar,locatie:p.locatie,opgave:p.opgave,type:p.type,status:p.status,bureau:p.bureau_of_begeleiding||"",team:p.ontwerpteam,tekst:p.tekst,
      fotos:(p.fotos||[]).map(f=>[f.beeld,f.bijschrift||""]),tekeningen:(p.tekeningen||[]).map(f=>[f.beeld,f.bijschrift||""])}))
      .sort((a,b)=>b.nr.localeCompare(a.nr,undefined,{numeric:true})),
    studio:d.studio.map(x=>[x.kop,x.tekst])};
  start();
});
/* ===== weergaven ===== */
const NAMEN={Thorben:"Thorben Contant",Beau:"Beau Schellevis"};
const initialen=p=>["Thorben","Beau"].filter(n=>p.door.includes(n)).map(n=>n[0].toLowerCase()).join("");
let CATS=[];
const app=document.getElementById('app'), burger=document.getElementById('burger');
let persoon="Alle", filter="Alle", menuOpen=false, beeld=0, tab="fotos", cur=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function home(){
  app.innerHTML=`<a class="hero fade" href="#werk" aria-label="Naar het werk"><img src="${SITE.hoofdbeeld.src}" alt=""></a><p class="cap pad">${esc(SITE.hoofdbeeld.bijschrift)}</p>`;
}
function menu(){
  app.innerHTML=`<nav class="menu fade">${["Werk","Studies","Studio","Contact"].map(m=>`<button data-go="${m.toLowerCase()}">${m}</button>`).join("")}</nav>`;
}
function werk(alleenStudies){
  const lijst=SITE.projecten.filter(p=>(!alleenStudies||p.cat==="Studie")&&(filter==="Alle"||p.cat===filter)&&(persoon==="Alle"||p.door.includes(persoon)));
  app.innerHTML=`<div class="chips pad">${["Alle",...CATS].map(c=>`<button aria-pressed="${c===filter}" data-f="${c}">${c}</button>`).join("")}</div>
  <div class="grid fade">${lijst.length?lijst.map(p=>`<a class="cell" href="#p${p.nr}">
    <div class="num">${p.nr}<span class="by" title="${p.door.map(d=>NAMEN[d]).join(', ')}">${initialen(p)}</span></div>
    <div class="thumb"><img src="${p.fotos[0]?p.fotos[0][0]:""}" alt="" loading="lazy"></div>
    <div class="ttl"><strong>${esc(p.titel)}</strong> – ${esc(p.plaats)}</div></a>`).join(""):`<p class="empty">Nog geen projecten in deze selectie.</p>`}</div>`;
}
function feit(k,v){return v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:""}
function project(nr){
  const p=SITE.projecten.find(x=>x.nr===nr); if(!p){location.hash="werk";return}
  cur=p; if(tab==="tekeningen"&&!p.tekeningen.length) tab="fotos";
  if(!p.fotos.length){app.innerHTML='<p class="empty">Dit project heeft nog geen foto\'s.</p>';return}
  const set=p[tab], n=set.length, i=Math.min(beeld,n-1), [src,bij]=set[i];
  app.innerHTML=`<div class="phead pad"><div>THURBO ${p.nr}<span class="by">${initialen(p)}</span><br><strong>${esc(p.titel)}</strong> – ${esc(p.plaats)}</div><a class="close" href="#werk" aria-label="Sluiten">×</a></div>
  <div class="stage"><img class="fade" src="${src}" alt="${esc(bij)}">
    ${n>1?`<button class="tap" data-step="-1" aria-label="Vorige"></button><button class="tap r" data-step="1" aria-label="Volgende"></button>`:""}</div>
  <p class="bij pad">${esc(bij)}</p>
  <div class="pbar pad"><span>${i+1}/${n}</span><button id="infoBtn">↓ Info</button>
    ${p.tekeningen.length?`<button aria-pressed="${tab==="tekeningen"}" data-tab="${tab==="tekeningen"?"fotos":"tekeningen"}">${tab==="tekeningen"?"Beelden":"Tekeningen"}</button>`:`<span></span>`}</div>
  <section class="info pad" id="info"><p>${esc(p.tekst)}</p>
    <dl class="facts">${feit("Jaar",p.jaar)}${feit("Locatie",p.locatie)}${feit("Opgave",p.opgave)}${feit("Type",p.type)}${feit("Status",p.status)}${feit(p.cat==="Praktijk"?"Bureau":"Begeleiding",p.bureau)}${feit("Ontwerpteam",p.team)}</dl></section>`;
}
function studio(){
  app.innerHTML=`<dl class="list pad fade">${SITE.studio.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
}

function render(){
  if(!SITE) return;
  const h=location.hash.slice(1);
  burger.classList.toggle('x',menuOpen); burger.setAttribute('aria-label',menuOpen?"Menu sluiten":"Menu openen");
  if(menuOpen) return menu();
  if(h==="werk") return werk(false);
  if(h==="studies") return werk(true);
  if(h==="studio"||h==="contact") return studio();
  if(/^p\d+$/.test(h)) return project(h.slice(1));
  home();
}
burger.onclick=()=>{menuOpen=!menuOpen;render();window.scrollTo(0,0)};
document.querySelector('.name').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  persoon=b.dataset.p; menuOpen=false;
  document.querySelectorAll('.name button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const h=location.hash.slice(1);
  if(persoon==="Alle"){ if(h) location.hash=""; else render(); window.scrollTo(0,0); return; }
  if(h==="werk"||h==="studies") render(); else location.hash="werk";
});
addEventListener('hashchange',()=>{menuOpen=false;beeld=0;tab="fotos";render();window.scrollTo(0,0)});
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go){menuOpen=false; if(location.hash==="#"+b.dataset.go) render(); else location.hash=b.dataset.go}
  if(b.dataset.f){filter=b.dataset.f;render()}
  if(b.dataset.step&&cur){const n=cur[tab].length;beeld=((Math.min(beeld,n-1))+ +b.dataset.step+n)%n;render()}
  if(b.dataset.tab){tab=b.dataset.tab;beeld=0;render()}
  if(b.id==="infoBtn") document.getElementById('info').scrollIntoView({behavior:"smooth"});
});
addEventListener('keydown',e=>{if(cur&&/^#p/.test(location.hash)&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const n=cur[tab].length;beeld=(Math.min(beeld,n-1)+(e.key==="ArrowRight"?1:-1)+n)%n;render()}});
function start(){CATS=[...new Set(SITE.projecten.map(p=>p.cat))];render();}
</script>
</body>
</html>
