# Draait vanzelf na elke wijziging (ook vanuit Pages CMS):
# 0. vult lege Engelse velden met een vertaling (DeepL; alleen als de secret DEEPL_KEY is ingesteld)
# 1. snijdt beelden bij waarbij het veld Bijsnijden is ingevuld (img/bijgesneden/)
# 2. maakt kleine versies van nieuwe beelden voor de overzichten (img/klein/)
# 3. zet naam en auteursrecht in de gegevens (EXIF, IPTC, XMP) van elk beeld dat dat nog niet heeft
# 4. laat Bing en andere zoekmachines (IndexNow) weten dat er iets nieuw is
name: Na elke wijziging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kleine-beelden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engelse teksten vertalen
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: python3 .github/scripts/vertaal.py || echo "Vertalen mislukt; de site toont dan het Nederlands"
      - name: Beelden bijsnijden
        run: |
          pip install --quiet pillow
          python3 .github/scripts/bijsnijden.py
      - name: Kleine beelden maken
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os
          for bron, doel in (('img', 'img/klein'), ('img/bijgesneden', 'img/klein/bijgesneden')):
            os.makedirs(doel, exist_ok=True)
            for f in sorted(os.listdir(bron)):
              p = os.path.join(bron, f)
              if not os.path.isfile(p) or not f.lower().endswith(('.jpg', '.jpeg', '.png', '.webp')):
                  continue
              o = os.path.join(doel, os.path.splitext(f)[0] + '.jpg')
              if os.path.exists(o):
                  continue
              im = ImageOps.exif_transpose(Image.open(p))
              im.thumbnail((900, 900), Image.LANCZOS)
              im.convert('RGB').save(o, 'JPEG', quality=78, optimize=True, progressive=True)
              print('klein:', o)
          PY
      - name: Auteursrecht in de beeldgegevens zetten
        run: |
          sudo apt-get install -y -qq libimage-exiftool-perl > /dev/null
          exiftool -q -q -r -overwrite_original -P -charset iptc=UTF8 -codedcharacterset=utf8 \
            -if 'not $XMP-xmpRights:WebStatement' \
            -ext jpg -ext jpeg -ext png -ext webp \
            -Artist="Studio THURBO (Thorben Contant & Beau Schellevis)" \
            -Copyright="© Studio THURBO. Alle rechten voorbehouden. Geen hergebruik zonder schriftelijke toestemming: info@thurbo.nl" \
            -XMP-dc:Creator="Studio THURBO (Thorben Contant & Beau Schellevis)" \
            -XMP-dc:Rights="© Studio THURBO. Alle rechten voorbehouden." \
            -XMP-xmpRights:Marked=True -XMP-xmpRights:WebStatement="https://thurbo.nl/voorwaarden" \
            -XMP-photoshop:Credit="Studio THURBO" \
            -XMP-iptcCore:CreatorWorkEmail="info@thurbo.nl" -XMP-iptcCore:CreatorWorkURL="https://thurbo.nl" \
            -IPTC:By-line="Studio THURBO" -IPTC:CopyrightNotice="© Studio THURBO. Alle rechten voorbehouden." -IPTC:Credit="Studio THURBO" \
            img || true
      - name: Opslaan als er iets nieuw is
        run: |
          git add img content .github/scripts/vertalingen.json 2>/dev/null || git add img content
          if git diff --cached --quiet; then echo "niets nieuw"; exit 0; fi
          git config user.name "THURBO automatisch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Vertalingen, kleine beelden en auteursrecht in beeldgegevens bijgewerkt"
          git pull --rebase -q || true
          git push

  deepl-verbruik:
    # faalt (en GitHub mailt) als DeepL deze maand boven 80% zit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DeepL-verbruik controleren
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: python3 .github/scripts/vertaal.py --gebruik

  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wachten tot de site online staat
        run: sleep 150
      - name: Zoekmachines laten weten dat er iets nieuw is
        run: |
          for adres in https://thurbo.nl/sitemap.xml https://thurbo.pages.dev/sitemap.xml; do
            curl -sL -A "Mozilla/5.0 (THURBO IndexNow)" -w "\n%{http_code} $adres\n" "$adres" > sitemap.txt; tail -1 sitemap.txt
            grep -q '<loc>' sitemap.txt && break
          done
          URLS=$(grep -o '<loc>[^<]*' sitemap.txt | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "$URLS"
          if [ "$URLS" = "[]" ]; then echo "Geen sitemap gevonden"; exit 1; fi
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"thurbo.nl\",\"key\":\"8a9879ca79738f243e9c87d3b10a355c\",\"keyLocation\":\"https://thurbo.nl/8a9879ca79738f243e9c87d3b10a355c.txt\",\"urlList\":$URLS}"
